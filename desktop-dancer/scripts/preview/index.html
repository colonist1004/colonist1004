<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script type="importmap">
      { "imports": {
          "three": "../../src/renderer/vendor/three.module.js",
          "three/addons/": "../../src/renderer/vendor/jsm/",
          "@pixiv/three-vrm": "../../src/renderer/vendor/three-vrm.module.js",
          "@pixiv/three-vrm-animation": "../../src/renderer/vendor/three-vrm-animation.module.js" } }
    </script>
    <style>html,body{margin:0;background:#8a9bb0}</style>
  </head>
  <body>
    <script type="module">
      // Dev preview: renders a GLB/VRM from several angles (optionally posed by a VRMA at time t).
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
      import { VRMAnimationLoaderPlugin, createVRMAnimationClip } from '@pixiv/three-vrm-animation';
      window.render = async ({ model, motion, t = 0, views = [0, 90, 180], size = 360, skeleton = false }) => {
        const loader = new GLTFLoader();
        loader.register((p) => new VRMLoaderPlugin(p));
        loader.register((p) => new VRMAnimationLoaderPlugin(p));
        const parse = async (b64) => {
          const bin = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
          return loader.parseAsync(bin.buffer, '');
        };
        const g = await parse(model);
        const vrm = g.userData.vrm;
        const root = vrm ? vrm.scene : g.scene;
        if (vrm) VRMUtils.rotateVRM0(vrm);
        const scene = new THREE.Scene();
        scene.add(root);
        scene.add(new THREE.HemisphereLight(0xffffff, 0x8888aa, 1.2));
        const sun = new THREE.DirectionalLight(0xffffff, 1.5);
        sun.position.set(1, 2, 3);
        scene.add(sun);
        if (vrm && motion) {
          const anim = (await parse(motion)).userData.vrmAnimations[0];
          const mixer = new THREE.AnimationMixer(vrm.scene);
          mixer.clipAction(createVRMAnimationClip(anim, vrm)).play();
          mixer.setTime(t);
        }
        if (vrm) vrm.update(0);
        root.updateMatrixWorld(true);
        if (skeleton) {
          const h = new THREE.SkeletonHelper(root);
          h.material.depthTest = false;
          h.material.linewidth = 2;
          scene.add(h);
        }
        const box = new THREE.Box3().setFromObject(root);
        const c = box.getCenter(new THREE.Vector3());
        const ext = box.getSize(new THREE.Vector3());
        const r = Math.max(ext.x, ext.y, ext.z) * 0.6;
        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(size * views.length, size);
        renderer.setScissorTest(true);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);
        views.forEach((deg, i) => {
          const cam = new THREE.OrthographicCamera(-r, r, r, -r, 0.01, 100);
          const a = (deg * Math.PI) / 180;
          cam.position.set(c.x + Math.sin(a) * 10, c.y, c.z + Math.cos(a) * 10);
          cam.lookAt(c);
          renderer.setViewport(i * size, 0, size, size);
          renderer.setScissor(i * size, 0, size, size);
          renderer.setClearColor(0x8a9bb0);
          renderer.render(scene, cam);
        });
        return { png: renderer.domElement.toDataURL('image/png'), box: [box.min.toArray(), box.max.toArray()] };
      };
      window.ready = true;
    </script>
  </body>
</html>
