name: Build Desktop Dancer (Windows)

on:
  push:
    branches: ["**"]
    paths: ["desktop-dancer/**", ".github/workflows/desktop-dancer-windows.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-dancer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop-dancer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Tests (window placement + sample character/dance)
        run: npm test

      - name: Build portable exe and installer
        run: npm run dist

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: desktop-dancer-windows
          path: |
            desktop-dancer/dist/*.exe
          if-no-files-found: error
