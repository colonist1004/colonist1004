name: Build Desktop Dancer (Windows)

on:
  push:
    branches: ["**"]
    paths: ["desktop-dancer/**", ".github/workflows/desktop-dancer-windows.yml"]
  workflow_dispatch:

jobs:
  pipeline-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-dancer/pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy (the round-trip tests need nothing else)
        run: pip install numpy
      - name: Retarget / SMPL / VRMA / loop round-trip tests
        run: python tests/test_roundtrip.py
      - name: Character pipeline tests (bone mapping, T-pose, auto-rig, VRM)
        run: python tests/test_character.py
      - name: BVH import tests
        run: python tests/test_bvh.py
      - name: MMD motion (VMD) import tests
        run: python tests/test_vmd.py
      - name: RTMW3D conversion tests (depth sign/scale calibration)
        run: python tests/test_rtm.py
      - name: Local 3D generation post-processing (orientation, UV bake; no GPU, no weights)
        run: |
          pip install opencv-python-headless trimesh xatlas fast-simplification scipy
          python tests/test_gen.py

  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-dancer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop-dancer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Tests (window placement + sample character/dance)
        run: npm test

      - name: Build installer
        run: npm run dist

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: desktop-dancer-windows
          path: |
            desktop-dancer/dist/*.exe
          if-no-files-found: error
