<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#121316">
<title>사진 편집기</title>
<link rel="stylesheet" href="css/app.css">
<script src="vendor/capacitor.js"></script>
</head>
<body>
<header class="top">
  <label class="tb open" title="사진 열기">
    <svg viewBox="0 0 24 24"><path d="M4 5h4l2-2h4l2 2h4v14H4z M12 8a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z"/></svg><span>열기</span>
    <input id="file" type="file" accept="image/*" hidden>
  </label>
  <button class="tb" id="undo" title="실행 취소"><svg viewBox="0 0 24 24"><path d="M9 7H4V2 M4 7a8 8 0 1 1-1 7"/></svg></button>
  <button class="tb" id="redo" title="다시 실행"><svg viewBox="0 0 24 24"><path d="M15 7h5V2 M20 7a8 8 0 1 0 1 7"/></svg></button>
  <button class="tb" id="cmp" title="누르는 동안 원본 보기"><svg viewBox="0 0 24 24"><path d="M12 3v18 M5 5h14v14H5z"/></svg><span>원본</span></button>
  <span class="sp"></span>
  <button class="tb" id="share" title="공유"><svg viewBox="0 0 24 24"><path d="M12 3v12 M7 8l5-5 5 5 M5 13v7h14v-7"/></svg></button>
  <button class="tb pri" id="save" title="저장"><svg viewBox="0 0 24 24"><path d="M12 4v11 M7 10l5 5 5-5 M5 20h14"/></svg><span>저장</span></button>
</header>

<main id="viewer">
  <div id="empty" class="empty">
    <label class="bigopen">사진 열기<input id="file2" type="file" accept="image/*" hidden></label>
    <p>사진은 기기 안에서만 처리되고 외부로 전송되지 않습니다.</p>
  </div>
  <div id="stage" hidden>
    <canvas id="cv"></canvas>
    <div id="cropOverlay" hidden>
      <div class="shade" id="shT"></div><div class="shade" id="shB"></div><div class="shade" id="shL"></div><div class="shade" id="shR"></div>
      <div id="cropBox">
        <i class="g1"></i><i class="g2"></i><i class="g3"></i><i class="g4"></i>
        <b data-h="nw"></b><b data-h="ne"></b><b data-h="sw"></b><b data-h="se"></b>
        <b data-h="n"></b><b data-h="s"></b><b data-h="w"></b><b data-h="e"></b>
      </div>
    </div>
  </div>
  <div id="cursor" hidden></div>
  <div id="busy" hidden><div class="spin"></div><div>저장 중…<small>큰 사진은 몇 초 걸려요</small></div></div>
</main>

<aside class="side">
  <canvas id="hist"></canvas>
  <div id="panel"></div>
  <nav id="tabs"></nav>
</aside>
<div class="toast" id="toast"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
